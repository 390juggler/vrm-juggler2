<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex,nofollow" />
    <title>VRM Juggler</title>
    <script src="./vrm-juggler.min.js"></script>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: sans-serif;
        background: linear-gradient(#fbfbfd 0%, #eef0f5 60%, #dfe2ea 100%);
      }

      #vrm-juggler {
        width: 100vw;
        height: 100vh;
      }

      .toolbar {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 20;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 8px 12px;
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.85);
        font-size: 14px;
      }

      .toolbar input[type='text'] {
        width: 8em;
        font-size: 16px;
      }

      .toolbar .hint {
        color: #666;
      }
    </style>
  </head>

  <body>
    <div class="toolbar">
      <label>VRM を読み込む <input type="file" id="vrm-file" accept=".vrm" /></label>
      <form id="siteswap-form">
        <label>サイトスワップ <input type="text" id="siteswap" value="3" autocomplete="off" /></label>
        <button type="submit">投げる</button>
      </form>
      <span class="hint">Esc で詳細設定</span>
    </div>
    <div id="vrm-juggler"></div>

    <script>
      document.addEventListener('DOMContentLoaded', () => {
        // モデルを指定しなければ ./models/default.vrm を読み込む
        const juggler = new VRMJuggler('#vrm-juggler');

        let objectURL;
        document.getElementById('vrm-file').addEventListener('change', (e) => {
          const file = e.target.files[0];
          if (!file) return;
          if (objectURL) URL.revokeObjectURL(objectURL);
          objectURL = URL.createObjectURL(file);
          juggler.loadModel(objectURL);
        });

        document.getElementById('siteswap-form').addEventListener('submit', (e) => {
          e.preventDefault();
          juggler.setSiteswap(document.getElementById('siteswap').value);
        });

        // 「近いパターン」のボタンで切り替えた時も入力欄を合わせる
        document.getElementById('vrm-juggler').addEventListener('siteswapchange', (e) => {
          document.getElementById('siteswap').value = e.detail.siteswap;
        });
      });
    </script>
  </body>
</html>
